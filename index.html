<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra trắc nghiệm Toán 10</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16231f;--mute:#5d6f68;--line:#cfdad5;--acc:#0f6b57;--accink:#fff;--ok:#157a3d;--okbg:#e2f4e8;--bad:#b3261e;--badbg:#fbe6e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18241f;--ink:#e8f1ed;--mute:#9fb3ab;--line:#2c3e37;--acc:#4fc3a1;--accink:#06231b;--ok:#6fd392;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18241f;--ink:#e8f1ed;--mute:#9fb3ab;--line:#2c3e37;--acc:#4fc3a1;--accink:#06231b;--ok:#6fd392;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.name{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.q{font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.opt b{min-width:1.4em;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--card);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.exp{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:6px;color:var(--mute);font-size:.95rem}
.btn{width:100%;padding:14px;font:inherit;font-weight:700;color:var(--accink);background:var(--acc);border:0;border-radius:12px;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc);margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.score{font-size:2.4rem;font-weight:800;margin:0}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em}
.hide{display:none}
.rt{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-weight:600}
.st{color:var(--mute);margin:0 0 10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<main>
<h1>Kiểm tra trắc nghiệm Toán 10</h1>
<p class="sub">5 câu · Hàm số bậc hai, bất phương trình, tập hợp, lượng giác</p>

<div id="start" class="card">
<label class="name" for="nm">Họ và tên</label>
<input id="nm" type="text" autocomplete="name" placeholder="Nguyễn Văn A">
<label class="name" for="cl" style="margin-top:12px">Lớp</label>
<input id="cl" type="text" placeholder="10A1">
<p class="err" id="e1"></p>
<button class="btn" id="go">Bắt đầu làm bài</button>
</div>

<div id="quiz" class="hide">
<div class="bar"><i id="pb"></i></div>
<div id="qs"></div>
<p class="err" id="e2"></p>
<button class="btn" id="sub">Nộp bài</button>
</div>

<div id="res" class="card hide">
<p class="sub" id="who"></p>
<p class="score" id="sc"></p>
<p id="msg" class="sub"></p>
<p class="sub">Xem lại đáp án và lời giải bên dưới. Chụp màn hình kết quả để gửi giáo viên.</p>
<p class="rt" id="rt"></p>
<p class="st" id="st"></p>
<button class="btn" id="cp">Sao chép kết quả</button>
<button class="btn alt" id="again">Làm lại</button>
</div>
<div id="tc" class="card hide">
<p class="q">Bảng điểm (chỉ giáo viên thấy)</p>
<p class="sub" id="tn">Chưa có bài nộp.</p>
<div class="tw"><table><thead><tr><th>Lớp</th><th>Họ tên</th><th>Đúng</th><th>Điểm</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main>

<script>
var Q=[
{q:"Đỉnh của parabol y = x² − 4x + 3 là điểm nào?",o:["I(2; −1)","I(−2; −1)","I(2; 1)","I(4; 3)"],a:0,
e:"Hoành độ đỉnh x = −b/(2a) = 4/2 = 2. Thay vào: y = 4 − 8 + 3 = −1. Vậy I(2; −1)."},
{q:"Tập nghiệm của bất phương trình x² − 5x + 6 < 0 là:",o:["(−∞; 2) ∪ (3; +∞)","[2; 3]","(2; 3)","(−3; −2)"],a:2,
e:"x² − 5x + 6 = (x − 2)(x − 3). Hệ số a = 1 > 0 nên tam thức âm trong khoảng giữa hai nghiệm: 2 < x < 3."},
{q:"Tổng hai nghiệm của phương trình x² − 2x − 3 = 0 bằng:",o:["−2","−3","3","2"],a:3,
e:"Theo Vi-ét: x₁ + x₂ = −b/a = 2. (Kiểm tra: nghiệm là −1 và 3, tổng bằng 2.)"},
{q:"Cho A = {1; 2; 3; 4} và B = {3; 4; 5}. Tập A ∩ B là:",o:["{1; 2; 3; 4; 5}","{3; 4}","{1; 2}","{5}"],a:1,
e:"A ∩ B gồm các phần tử thuộc cả A và B, đó là 3 và 4."},
{q:"Giá trị của sin 30° + cos 60° bằng:",o:["1/2","√3","0","1"],a:3,
e:"sin 30° = 1/2 và cos 60° = 1/2, nên tổng bằng 1."}
];
var L="ABCD",pick=[],done=false;
function $(i){return document.getElementById(i)}
var DB=null,UID=null,CAN=false,TXT="";
(async function(){try{
 var c=window.claude;if(!c)return;
 var U=await c.use("user");DB=await c.use("db");
 if(U){try{UID=await U.id()}catch(e){}
  CAN=!!(DB&&UID&&U.can&&U.can("data.write")===true);
  if(DB&&U.isOwner&&U.isOwner())teacher();}
}catch(e){}})();
function teacher(){
 $("tc").classList.remove("hide");
 DB.collection("results").onSnapshot(function(s){
  var rows=s.docs.map(function(d){return d.data()||{}}).sort(function(a,b){return (b.t||0)-(a.t||0)});
  var tb=$("tb");tb.textContent="";
  rows.forEach(function(r){var tr=document.createElement("tr");
   [r.cls,r.name,r.score+"/"+r.total,r.pts].forEach(function(v){var td=document.createElement("td");td.textContent=v==null?"":String(v);tr.appendChild(td)});
   tb.appendChild(tr)});
  $("tn").textContent=rows.length?rows.length+" bài đã nộp":"Chưa có bài nộp.";
 },function(){});
}
function save(s){
 var cls=$("cl").value.trim(),name=$("nm").value.trim(),pts=(s/Q.length*10).toFixed(1);
 TXT="Lớp "+cls+" – "+name+": "+s+"/"+Q.length+" câu đúng ("+pts+"/10)";
 $("rt").textContent=TXT;
 var st=$("st");
 if(CAN){
  st.textContent="Đang gửi kết quả cho giáo viên...";
  DB.collection("results").doc(UID).set({cls:cls,name:name,score:s,total:Q.length,pts:pts,t:Date.now()})
   .then(function(){st.textContent="Đã gửi kết quả cho giáo viên."})
   .catch(function(){st.textContent="Chưa gửi được. Hãy sao chép kết quả gửi giáo viên."});
 }else{
  st.textContent="Kết quả chưa tự gửi được. Hãy sao chép kết quả hoặc chụp màn hình gửi giáo viên.";
 }
}
document.addEventListener("click",function(ev){
 if(ev.target.id!=="cp")return;
 try{navigator.clipboard.writeText(TXT).then(function(){ev.target.textContent="Đã sao chép"},function(){ev.target.textContent="Không sao chép được, hãy chụp màn hình"})}
 catch(e){ev.target.textContent="Không sao chép được, hãy chụp màn hình"}
});
function render(){
 var h="";
 Q.forEach(function(q,i){
  h+='<div class="card"><p class="q">Câu '+(i+1)+'. '+q.q+'</p>';
  q.o.forEach(function(t,j){h+='<button type="button" class="opt" data-q="'+i+'" data-o="'+j+'"><b>'+L[j]+'.</b><span>'+t+'</span></button>'});
  h+='<div class="exp hide" id="x'+i+'"></div></div>';
 });
 $("qs").innerHTML=h;
}
function prog(){var n=pick.filter(function(v){return v!==undefined}).length;$("pb").style.width=(n/Q.length*100)+"%";return n}
$("go").onclick=function(){
 if(!$("nm").value.trim()||!$("cl").value.trim()){$("e1").textContent="Nhập họ và tên và lớp để bắt đầu.";return}
 $("start").classList.add("hide");$("quiz").classList.remove("hide");pick=[];done=false;render();prog();window.scrollTo(0,0);
};
$("qs").onclick=function(ev){
 var b=ev.target.closest(".opt");if(!b||done)return;
 var i=+b.dataset.q,j=+b.dataset.o;pick[i]=j;
 document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(function(x){x.classList.toggle("sel",+x.dataset.o===j)});
 $("e2").textContent="";prog();
};
$("sub").onclick=function(){
 var n=prog();
 if(n<Q.length){$("e2").textContent="Còn "+(Q.length-n)+" câu chưa trả lời.";return}
 done=true;var s=0;
 Q.forEach(function(q,i){
  if(pick[i]===q.a)s++;
  document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(function(x){
   var j=+x.dataset.o;x.disabled=true;x.classList.remove("sel");
   if(j===q.a)x.classList.add("ok");else if(j===pick[i])x.classList.add("bad");
  });
  var e=$("x"+i);e.textContent="Lời giải: "+q.e;e.classList.remove("hide");
 });
 $("who").textContent="Lớp "+$("cl").value.trim()+" · Học sinh: "+$("nm").value.trim();
 $("sc").textContent=s+" / "+Q.length+" câu đúng";
 $("msg").textContent="Điểm: "+(s/Q.length*10).toFixed(1)+" / 10";
 $("res").classList.remove("hide");$("sub").classList.add("hide");
 $("res").scrollIntoView();save(s);
};
$("again").onclick=function(){
 $("res").classList.add("hide");$("sub").classList.remove("hide");$("quiz").classList.add("hide");
 $("start").classList.remove("hide");window.scrollTo(0,0);
};
</script>
</body>
</html>
